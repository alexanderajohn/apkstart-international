name: CI

on:
  push:
    branches: [main, feature/international-foundation]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 单元测试（Windows / Node ${{ matrix.node }}）
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # 单元测试不需要 Electron 二进制，跳过 188MB 下载以加快 CI
      - name: 安装依赖
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: 运行测试
        run: npm test

      - name: Check independent fork metadata
        run: npm run audit:international

      - name: Run internationalization and fork-safety tests
        run: npm run test:international

      - name: Verify generated locale bundles are committed
        shell: pwsh
        run: |
          npm run i18n:build
          if (git status --porcelain -- src/ui/i18n/catalogs.js) {
            Write-Error "Localization bundle is stale. Run npm run i18n:build and commit catalogs.js."
            exit 1
          }

      # 直接驱动 agent.ps1 内嵌 C# 的钩子回调，防止键位映射被改坏
      - name: 鼠标钩子逻辑冒烟测试
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          $out = & .\test\pointer-hook-logic.ps1
          $out | ForEach-Object { Write-Host $_ }
          if (-not ($out -contains 'POINTER_HOOK_LOGIC_OK')) { exit 1 }

  preview:
    name: Build Windows developer preview (no Android runtime)
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/feature/international-foundation'
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Electron build dependencies
        run: npm ci
      - name: Package Windows portable preview
        run: npm run pack
      - name: Verify portable executable and bundled code
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'dist/ApkStart-International-win64-portable'
          $exe = Join-Path $root 'ApkStart International.exe'
          if (!(Test-Path $exe)) { throw "Portable EXE not produced: $exe" }
          $ui = Join-Path $root 'resources/app/src/ui/index.html'
          if (!(Test-Path $ui)) { throw "Renderer files missing: $ui" }
          Write-Host "Preview built at $exe"
      - name: Smoke-run SmartCheck with synthetic APK (no Android provisioning)
        continue-on-error: false
        timeout-minutes: 3
        shell: pwsh
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'asi-preview-appdata'
          $data = Join-Path $env:APPDATA 'apkstart-international'
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          '{"autoDeploy":false,"autoStart":false,"welcome":{"disabled":true},"engine":{"prewarm":false,"chineseIme":false}}' | Set-Content -Encoding utf8 (Join-Path $data 'settings.json')
          $exe = Join-Path $PWD 'dist/ApkStart-International-win64-portable/ApkStart International.exe'
          $shot = Join-Path $env:RUNNER_TEMP 'asi-preview-smoke.png'
          $env:ASI_SMARTCHECK_FIXTURE = Join-Path $env:RUNNER_TEMP 'asi-smartcheck-synthetic.apk'
          node -e "const fs=require('fs'); const { buildApkBytes }=require('./test/lib/make-apk'); fs.writeFileSync(process.env.ASI_SMARTCHECK_FIXTURE,buildApkBytes({permissions:['android.permission.CAMERA','android.permission.INTERNET']}));"
          $p = Start-Process -FilePath $exe -ArgumentList @('--smoke', $shot, '--smartcheck', '--auto-repair', '--smart-performance', '--profiles', '--backup') -PassThru
          if (-not $p.WaitForExit(130000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'UI smoke timed out (Windows CI may not provide a desktop session)'
          }
          if (!(Test-Path $shot)) { throw 'No UI smoke screenshot was saved' }
          Copy-Item $shot (Join-Path $PWD 'asi-preview-smoke.png') -Force
          $arShot = $shot -replace '\.png$', '-auto-repair.png'
          if (!(Test-Path $arShot)) { throw 'Auto-Repair screenshot was not saved' }
          Copy-Item $arShot (Join-Path $PWD 'asi-auto-repair-smoke.png') -Force
          $perfShot = $shot -replace '\.png$', '-smart-performance.png'
          if (!(Test-Path $perfShot)) { throw 'Smart Performance screenshot was not saved' }
          Copy-Item $perfShot (Join-Path $PWD 'asi-smart-performance-smoke.png') -Force
          $profilesShot = $shot -replace '\.png$', '-profiles.png'
          if (!(Test-Path $profilesShot)) { throw 'Android Profiles screenshot was not saved' }
          Copy-Item $profilesShot (Join-Path $PWD 'asi-profiles-smoke.png') -Force
          $backupShot = $shot -replace '\.png$', '-backup.png'
          if (!(Test-Path $backupShot)) { throw 'Backup Center screenshot was not saved' }
          Copy-Item $backupShot (Join-Path $PWD 'asi-backup-smoke.png') -Force
          $recoveryShot = $shot -replace '\.png$', '-recovery.png'
          if (!(Test-Path $recoveryShot)) { throw 'Recovery Vault screenshot was not saved' }
          Copy-Item $recoveryShot (Join-Path $PWD 'asi-recovery-smoke.png') -Force
          $sealedShot = $shot -replace '\.png$', '-sealed.png'
          if (!(Test-Path $sealedShot)) { throw 'Encrypted Safety Vault screenshot was not saved' }
          Copy-Item $sealedShot (Join-Path $PWD 'asi-sealed-smoke.png') -Force
          $retentionShot = $shot -replace '\.png$', '-retention.png'
          if (!(Test-Path $retentionShot)) { throw 'Safety Retention screenshot was not saved' }
          Copy-Item $retentionShot (Join-Path $PWD 'asi-retention-smoke.png' ) -Force
          $healthShot = $shot -replace '\.png$', '-health.png'
          if (!(Test-Path $healthShot)) { throw 'Disaster health screenshot was not saved' }
          Copy-Item $healthShot (Join-Path $PWD 'asi-health-smoke.png') -Force
          $readinessShot = $shot -replace '\.png$', '-drill-readiness.png'
          if (!(Test-Path $readinessShot)) { throw 'Restore readiness preview screenshot was not saved' }
          Copy-Item $readinessShot (Join-Path $PWD 'asi-drill-readiness-smoke.png') -Force
          $drillShot = $shot -replace '\.png$', '-drill.png'
          if (!(Test-Path $drillShot)) { throw 'Isolated restore drill screenshot was not saved' }
          Copy-Item $drillShot (Join-Path $PWD 'asi-drill-smoke.png') -Force
          $auditShot = $shot -replace '\.png$', '-audit.png'
          if (!(Test-Path $auditShot)) { throw 'Recovery Audit Trail screenshot was not saved' }
          Copy-Item $auditShot (Join-Path $PWD 'asi-audit-smoke.png') -Force
          $signedShot = $shot -replace '\.png$', '-signed.png'
          if (!(Test-Path $signedShot)) { throw 'Signed checkpoint verification screenshot was not saved' }
          Copy-Item $signedShot (Join-Path $PWD 'asi-signed-smoke.png') -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ApkStart-International-Windows-dev-preview
          path: dist/ApkStart-International-win64-portable/
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ApkStart-International-smoke-screenshot
          path: |
            asi-preview-smoke.png
            asi-auto-repair-smoke.png
            asi-smart-performance-smoke.png
            asi-profiles-smoke.png
            asi-backup-smoke.png
            asi-recovery-smoke.png
            asi-sealed-smoke.png
            asi-retention-smoke.png
            asi-health-smoke.png
            asi-drill-readiness-smoke.png
            asi-drill-smoke.png
            asi-audit-smoke.png
            asi-signed-smoke.png
          retention-days: 3
          if-no-files-found: ignore
